# Fly.io: one always-on machine with a volume.
#
#   fly launch --copy-config --no-deploy        # pick an app name and region
#   fly volumes create soloagent_data --size 1   # same region as the app
#   fly secrets set SOLOAGENT_TOKEN=$(openssl rand -base64 32) SOLOAGENT_SECRET=$(openssl rand -base64 32)
#   fly deploy
app = "soloagent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7420"
  SOLOAGENT_DATA_DIR = "/data"

[[mounts]]
  source = "soloagent_data"
  destination = "/data"

[http_service]
  internal_port = 7420
  force_https = true
  # Chat connectors hold open connections and durable timers need a running
  # process, so keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
