name: Docker image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=soloagent
            org.opencontainers.image.description=Durable AI agents for Slack, Discord, Telegram, webhooks, the web, and your terminal.
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull the image that was just pushed and make sure it boots and answers its health check.
  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Run and health-check the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          docker run -d --name solo -p 7420:7420 -e SOLOAGENT_TOKEN=ci-token "$image"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7420/healthz; then
              echo
              curl -fsS -H "authorization: Bearer ci-token" http://localhost:7420/api/agents | head -c 300
              echo
              docker logs solo | head -20
              exit 0
            fi
            sleep 2
          done
          docker logs solo
          exit 1
